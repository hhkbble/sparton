[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparton"
version = "0.1.0"
description = "Sparton: Fast and Memory-Efficient Triton Kernel for Learned Sparse Retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name="hhkbble", email="hhkbble@users.noreply.github.com"}]

dependencies = [
    "triton>=3.3.1",
    "torch>=2.7.1",
]

[dependency-groups]
test = [
    "pytest>=9.0,<10",
]

[project.urls]
Homepage = "https://github.com/hhkbble/sparton"

[tool.pytest]
minversion = "9.0"
addopts = [
    "-ra",
    "--import-mode=importlib",
]
testpaths = ["tests"]
pythonpath = ["src"]
strict = true
strict_config = true
strict_markers = true
strict_parametrization_ids = true
strict_xfail = true
markers = [
    "cuda: tests that require a CUDA device",
    "optimized: tests that require the optimized (pure-Triton TMA) kernel",
    "slow: tests that are comparatively expensive",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
